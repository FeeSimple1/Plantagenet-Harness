name: Validate playtest fixes
on:
  push:
    branches: [audit/selfplay-20261009]
    paths: [.github/workflows/validate-playtest-fixes.yml]
permissions:
  contents: read
env:
  BASE_REVISION: 76353e6c12b30b3055a93fb714903f5d6b0707ee
  PATCH_SHA256: 85f80fe5801dee731319d866a71d842b2a3911f745e2512c6a9df04a889f4adf
  EXPECTED_TREE: 1173771e79f8f8cce32655ff593ddb29b9ad0692
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct and verify tested patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          root = Path('audit/playtest-fixes-20261010')
          expected = ['a54536a783fd1de4fd607e383b2067e83841907c', 'f433f61502ca8f340697159ca96493edb7a47136', 'b7f91db499b73846b0b11cce5b20bc0807260f00', '09397d05a5dc26eb0e8e14756c1748548abcc9a3']
          chunks = []
          for i, sha in enumerate(expected, 1):
              data = (root / f'part{i}.b64').read_bytes()
              digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert digest == sha, (i, digest, sha)
              chunks.append(data)
          patch = lzma.decompress(base64.b64decode(b''.join(chunks)))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          (Path(os.environ['RUNNER_TEMP']) / 'playtest-fixes.patch').write_bytes(patch)
          PY
          git checkout --detach "$BASE_REVISION"
          git apply --index "$RUNNER_TEMP/playtest-fixes.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,parallel]'
      - name: Lint
        run: ruff check .
      - name: Strict type check
        run: mypy
      - name: Full regression suite
        run: pytest -q -n 2 -p no:cacheprovider
  stage-commit:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct identical validated tree
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          root = Path('audit/playtest-fixes-20261010')
          patch = lzma.decompress(base64.b64decode(b''.join((root / f'part{i}.b64').read_bytes() for i in range(1, 5))))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          (Path(os.environ['RUNNER_TEMP']) / 'playtest-fixes.patch').write_bytes(patch)
          PY
          git checkout --detach "$BASE_REVISION"
          git apply --index "$RUNNER_TEMP/playtest-fixes.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
      - name: Commit fixes on isolated publication branch
        run: |
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote_main" = "$BASE_REVISION"
          git config user.name 'FeeSimple1'
          git config user.email 'ecommentation@gmail.com'
          git commit -m 'Fix playtest regressions in battle feeding, card timing and Bosworth setup' -m 'Feed stationary defenders; protect Held and pending Event cards from Capability levy; expose Parliament Votes opt-out and eliminate automatic-check RNG consumption; enumerate Great Ships Parley routes; require legal concealed Bosworth Capability selection and committed arrays before battle.' -m 'Add 39 regression cases with saved playtest fixtures and update action, setup, schema and traceability documentation. All 944 tests, Ruff and strict mypy pass on Python 3.10, 3.11 and 3.12. Locally verified on Python 3.13 as well.'
          git push origin HEAD:refs/heads/fix/playtest-20261010
          echo "Published candidate $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified tree $(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
