name: Validate grand-campaign fixes
on:
  push:
    branches: [audit/grand-campaign-fixes-20261010]
    paths: [.github/workflows/validate-grand-campaign-fixes.yml]
permissions:
  contents: read
env:
  BASE_REVISION: 17cb0fe0aafb375659f4888b596d4853f5edb5fd
  EXPECTED_TREE: 9674b0919f784158671a7a4f7ffacca39967d0cb
  PATCH_SHA256: 80ab1e2dcb91357c22e6c484878d08282fe752135f264c2144946404b96e3ea2
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct and verify exact fix tree
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          root = Path('audit/grand-fixes')
          encoded = b''.join((root / f'part{i}.b64').read_bytes() for i in range(1, 6))
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          (Path(os.environ['RUNNER_TEMP']) / 'grand-fixes.patch').write_bytes(patch)
          PY
          git checkout --detach "$BASE_REVISION"
          git apply --index "$RUNNER_TEMP/grand-fixes.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,parallel]'
      - name: Lint
        run: ruff check .
      - name: Strict type check
        run: mypy
      - name: Full regression suite including both War transitions
        run: pytest -q -n 2 -p no:cacheprovider --junitxml=grand-results.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-results-python-${{ matrix.python-version }}
          path: grand-results.xml
          if-no-files-found: ignore
          retention-days: 7
  stage-commit:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct identical validated tree
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          root = Path('audit/grand-fixes')
          encoded = b''.join((root / f'part{i}.b64').read_bytes() for i in range(1, 6))
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          (Path(os.environ['RUNNER_TEMP']) / 'grand-fixes.patch').write_bytes(patch)
          PY
          git checkout --detach "$BASE_REVISION"
          git apply --index "$RUNNER_TEMP/grand-fixes.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
      - name: Commit only the fixes on publication branch
        run: |
          git config user.name 'FeeSimple1'
          git config user.email 'ecommentation@gmail.com'
          git commit -m 'Fix complete grand-campaign playtest findings' -m 'Correct final-War Heir rosters and immediate victory, reject post-victory commands, use current-War Exile destinations, normalize JSON Battle Arrays, require the Loyalty and Trust target choice, enumerate Commission of Array recruitment, and stabilize saved-game history.' -m 'Add 71 regression tests and original campaign fixtures. The corrected 1101-action replay covers both Renewed-War transitions and matches fresh versus saved results and history. All 1015 tests, Ruff and strict mypy pass on Python 3.10, 3.11 and 3.12; also validated locally on Python 3.13.'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin HEAD:refs/heads/fix/grand-campaign-20261010
