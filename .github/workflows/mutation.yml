name: Mutation (manual)

# Mutation testing is a long-running job -- its proper home is CI, not an
# interactive session. Dispatch manually and pick a module; the job builds
# per-test coverage, then runs the coverage-guided harness over that module.
on:
  workflow_dispatch:
    inputs:
      module:
        description: "src/plantagenet module to mutate (e.g. battle.py)"
        required: true
        default: "influence.py"

permissions:
  contents: write   # the job commits its results to mutation-results/

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Per-test coverage
        run: pytest -q -p no:cacheprovider --cov=plantagenet --cov-context=test --cov-report=
      - name: Mutate ${{ inputs.module }}
        run: |
          mkdir -p mutation-results
          python scripts/mutation_cov.py \
            --target "src/plantagenet/${{ inputs.module }}" \
            --out "mutation-results/${{ inputs.module }}.jsonl" \
            | tee "mutation-results/${{ inputs.module }}.summary.txt"
      - name: Commit results
        # GITHUB_TOKEN pushes do not retrigger workflows, so no recursion.
        run: |
          git config user.name "mutation-ci"
          git config user.email "actions@github.com"
          git add mutation-results/
          git commit -m "Mutation results: ${{ inputs.module }} (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase && sleep $((i * 3))
          done
          exit 1
