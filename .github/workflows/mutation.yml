name: Mutation (manual)

# Mutation testing is a long-running job -- its proper home is CI, not an
# interactive session. Dispatch manually and pick a module; the job builds
# per-test coverage, then runs the coverage-guided harness over that module.
on:
  workflow_dispatch:
    inputs:
      module:
        description: "src/plantagenet module to mutate (e.g. battle.py)"
        required: true
        default: "influence.py"
  push:
    paths: ["mutation-requests/run.txt"]   # git-based dispatch: file content = module

permissions:
  contents: write   # the job commits its results to mutation-results/

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Per-test coverage
        run: pytest -q -p no:cacheprovider --cov=plantagenet --cov-context=test --cov-report=
      - name: Resolve module
        id: mod
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "module=${{ inputs.module }}" >> "$GITHUB_OUTPUT"
          else
            REQ=$(head -1 mutation-requests/run.txt)
            MOD=$(echo "$REQ" | awk '{print $1}')
            echo "module=$MOD" >> "$GITHUB_OUTPUT"
            # "module.py fresh" re-baselines: drop committed results so
            # --resume does not skip every already-recorded site.
            if echo "$REQ" | grep -q "fresh"; then
              rm -f "mutation-results/$MOD.jsonl"
            fi
          fi
      - name: Mutate ${{ steps.mod.outputs.module }}
        run: |
          mkdir -p mutation-results
          python scripts/mutation_cov.py \
            --target "src/plantagenet/${{ steps.mod.outputs.module }}" \
            --out "mutation-results/${{ steps.mod.outputs.module }}.jsonl" \
            --resume --max-seconds 18000 \
            | tee "mutation-results/${{ steps.mod.outputs.module }}.summary.txt"
      - name: Commit results
        # GITHUB_TOKEN pushes do not retrigger workflows, so no recursion.
        run: |
          git config user.name "mutation-ci"
          git config user.email "actions@github.com"
          git add mutation-results/
          git commit -m "Mutation results: ${{ steps.mod.outputs.module }} (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase && sleep $((i * 3))
          done
          exit 1
